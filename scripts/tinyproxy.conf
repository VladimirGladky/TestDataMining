# Минимальная конфигурация tinyproxy для локального тестирования парсера.
# Запуск:  tinyproxy -d -c scripts/tinyproxy.conf
# (флаг -d = foreground, чтобы видеть логи в терминале)

Port 3128
Listen 127.0.0.1

Timeout 60
DefaultErrorFile "/opt/homebrew/share/tinyproxy/default.html"
StatHost "tinyproxy.stats"
StatFile "/opt/homebrew/share/tinyproxy/stats.html"

LogLevel Info

MaxClients 50

# Прокси принимает соединения только с локального хоста
Allow 127.0.0.1

# HTTPS-туннелирование (CONNECT) на стандартный TLS-порт
ConnectPort 443
ConnectPort 563

# Скрываем заголовок Via, чтобы не палить tinyproxy
DisableViaHeader Yes
